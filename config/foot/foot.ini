# foot: Catppuccin Mocha + JetBrains Mono Nerd Font
# Matches Noctalia's builtin "Catppuccin" palette.

[main]
font=JetBrainsMono Nerd Font:size=11
pad=14x14
dpi-aware=no
selection-target=clipboard

[scrollback]
lines=10000
multiplier=3.0

[cursor]
blink=yes
style=beam

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.96
background=1e1e2e
foreground=cdd6f4

# black red green yellow blue magenta cyan white
regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de

# bright variants
bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8

# cursor + selection (rosewater on base)
cursor=1e1e2e 89b4fa
selection-foreground=1e1e2e
selection-background=f5e0dc

[csd]
preferred=server
